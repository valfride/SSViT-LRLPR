alphabet: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
early_stop_patience: 25
epoch_max: 500
func_train: SROCR_TRAIN
func_val: SROCR_VAL

# Autoregressive SVTRv2/NRTR baseline requested in the OJ-ITS revision.
# Architecture/loss provenance:
#   Topdu/OpenOCR @ 1ccfc6ee6161f7133b192e16af3a9265273997ba
#   configs/rec/nrtr/svtrv2_nrtr.yml
#   openrec/modeling/encoders/svtrnet.py
#   openrec/modeling/decoders/nrtr_decoder.py
#
# Controlled LRLPR training policy:
#   - train from scratch on the same LRLPR train/validation split;
#   - 32x96 LR input and the same repository augmentation wrapper;
#   - no external pretraining/data;
#   - lr=1e-4, max 500 epochs, OneCycleLR with 1.5-epoch warmup, matching
#     the existing non-CTC baseline family in this repository;
#   - validation-selected checkpoint with early-stop patience 25.
#
# Temporal evaluation is BJP/product-rule only. The decoder uses one shared
# fused prefix across all frames at each autoregressive step.
cls_loss: SVTRV2_AR

model_g:
  name: SVTRV2_AR_BASELINE
  args:
    in_channels: 3
    max_len: 7
    num_classes: 39  # EOS + 36 alphanumerics + BOS + PAD

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1.5
  cycle_momentum: false

name: SVTRV2_AR_BASELINE
optimizer_sr:
  args:
    betas:
    - 0.9
    - 0.999
    lr: 1e-4
    weight_decay: 0.05
  name: adamW

resume: null

train_dataset:
  batch: 64
  dataset:
    args:
      in_memory: true
      path_split: ./competition_dataset_lmdb
      phase: training
    name: lmdb_dataset
  wrapper:
    args:
      anagram_prob: 0.0
      aug: true
      background: (127, 127, 127)
      fully_synthetic_prob: 0.0
      image_aspect_ratio: 3.0
      imgH: 32
      imgW: 96
      in_images: 1
      synthetic_prob: 0.0
    name: VSR_collate_fn

use_ema_ghost: false
use_fp16: true

val_dataset:
  batch: 32
  dataset:
    args:
      in_memory: true
      path_split: ./competition_dataset_lmdb
      phase: validation
    name: lmdb_dataset
  wrapper:
    args:
      aug: false
      background: (127, 127, 127)
      fully_synthetic_prob: 0.0
      image_aspect_ratio: 3.0
      imgH: 32
      imgW: 96
      in_images: 5
      synthetic_prob: 0.0
      test: true
    name: VSR_Sequence_collate_fn

